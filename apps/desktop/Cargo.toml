[package]
name = "arcalabs"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
arca-core = { path = "../../crates/arca-core" }
arca-capture = { path = "../../crates/arca-capture" }
arca-compose = { path = "../../crates/arca-compose" }
arca-encode = { path = "../../crates/arca-encode" }
arca-audio = { path = "../../crates/arca-audio" }
arca-publish = { path = "../../crates/arca-publish" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "clipboard"] }
egui = "0.37"
tracing.workspace = true
raw-window-handle = "0.6"
bytes = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Direct3D11", "Win32_UI_WindowsAndMessaging", "Win32_Media_MediaFoundation", "Win32_System_Com"] }

[[bin]]
name = "arcalabs"
path = "native/main.rs"
