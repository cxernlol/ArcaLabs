          <a href="/privacy/">Privacy</a>
          <a href="/terms/">Terms</a>

            type="button"
            data-open-analytics-settings
            aria-controls="analytics-consent"
            aria-expanded="false"
          >
            Privacy settings
          </button>
        </nav>
      </footer>
    </div>
    <script type="module" src="/src/legal-entry.tsx"></script>
