[workspace]
resolver = "3"
members = ["crates/arca-core", "crates/arca-capture", "crates/arca-compose", "crates/arca-encode", "crates/arca-audio", "crates/arca-publish", "apps/desktop"]
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
directories = "6"
keyring = { version = "3", default-features = false, features = ["windows-native"] }
tracing = "0.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
